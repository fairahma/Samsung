<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinema TV</title><link rel="stylesheet" href="style.css"></head><body>
<aside id="sidebar"><div class="brand">CINEMA<span>TV</span></div><div class="eyebrow">YOUR CATALOGS</div><div id="sources"></div><div class="divider"></div><nav id="navigation"></nav><div class="remote-hint">↑ ↓ ← → to browse<br>OK to choose · Return to go back</div><button id="leave" class="quiet">Exit</button></aside>
<main><header><div><div class="eyebrow" id="source-caption"></div><h1 id="heading">Discover</h1></div><div class="search-wrap"><input id="search" type="search" placeholder="Find a movie or series" aria-label="Search this catalog"><button id="search-go">Search</button></div><button id="refresh" class="quiet">↻ Refresh</button></header><div id="filters"></div><div id="scroller" tabindex="-1"><section id="hero"></section><h2 id="list-title">Explore all titles</h2><div id="grid" aria-label="Movie catalog"></div><button id="more" class="load-more">Loading titles…</button></div></main>
<section id="details" class="overlay" hidden><div class="detail-art"><img id="detail-image" alt=""></div><div class="detail-content"><div id="detail-source" class="eyebrow"></div><h1 id="detail-title"></h1><p id="detail-meta" class="muted"></p><div class="detail-actions"><button id="detail-play" class="primary">▶ Play in app</button><button id="detail-save">＋ My List</button><button id="detail-back" class="quiet">‹ Back</button></div><h3>About this title</h3><p id="detail-description"></p><p class="muted small">Catalog and playback availability depend on the source.</p></div></section>
<section id="player" class="overlay" hidden><div id="player-toolbar"><button id="player-back">‹ Back</button><strong id="player-title"></strong><div id="player-sources"></div><button id="player-retry">↻ Retry</button><button id="player-enter" class="primary">Enter player</button></div><div id="player-stage"></div><div id="player-status">Loading available players…</div></section>
<section id="exit-dialog" class="modal" hidden><div><h2>Leave Cinema TV?</h2><p>Your saved list stays on this TV.</p><button id="exit-cancel" class="primary">Keep watching</button><button id="exit-confirm">Exit app</button></div></section><div id="toast" role="status"></div>
<script src="$WEBAPIS/webapis/webapis.js"></script><script src="core.js"></script><script src="app.js"></script></body></html>
